
# Perfil de demonstracao do SafeMarket
spring.application.name=safemarket

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:safemarket;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Porta do Render
server.port=${PORT:8080}

# Logs
logging.level.org.hibernate.SQL=WARN

# Tabela JDBC de auditoria com campos do segundo repositorio
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-demo.sql
